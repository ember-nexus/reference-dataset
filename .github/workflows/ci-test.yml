name: Test

on:
  - push

jobs:

  json-lint-nodes:
    runs-on: ubuntu-latest
    name: 'JSON lint nodes'
    steps:
      - uses: actions/checkout@v3
      - run: docker pull cytopia/jsonlint
      - run: docker run --rm -t -v $(pwd):/data cytopia/jsonlint -t '  ' 'node/*.json'

  json-lint-relations:
    runs-on: ubuntu-latest
    name: 'JSON lint relations'
    steps:
      - uses: actions/checkout@v3
      - run: docker pull cytopia/jsonlint
      - run: docker run --rm -t -v $(pwd):/data cytopia/jsonlint -t '  ' 'relation/*.json'

  markdown-lint:
    runs-on: ubuntu-latest
    name: 'Markdown lint'
    steps:
      - uses: actions/checkout@v3
      - run: docker pull tmknom/markdownlint
      - run: docker run --rm -v $(pwd):/work tmknom/markdownlint '**/*.md' --ignore CHANGELOG.md

  verify-no-duplicate:
    runs-on: ubuntu-latest
    name: 'Verify no duplicate'
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get install -y moreutils
      - run: ./update-backup.sh
